services:
  openmaic:
    image: openmaic-openmaic:20260410
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      OPENMAIC_CODE_SANDBOX_MODE: aio
      OPENMAIC_CODE_SANDBOX_AIO_BACKEND: docker
      OPENMAIC_CODE_SANDBOX_AIO_IMAGE: ${OPENMAIC_CODE_SANDBOX_AIO_IMAGE:-openmaic-sandbox:20260404}
      OPENMAIC_CODE_SANDBOX_AIO_DOCKER_SOCKET: /var/run/docker.sock
      OPENMAIC_CODE_SANDBOX_AIO_WORKDIR_MOUNT_PATH: /workspace
      OPENMAIC_CODE_SANDBOX_AIO_PREVIEW_BASE_URL: ${OPENMAIC_CODE_SANDBOX_AIO_PREVIEW_BASE_URL:-http://localhost:3000/api/code-preview}
      OPENMAIC_DIFY_ENABLED: ${OPENMAIC_DIFY_ENABLED:-false}
      OPENMAIC_DIFY_BASE_URL: ${OPENMAIC_DIFY_BASE_URL:-https://difytestapi.zhizuobiao.com/v1}
      OPENMAIC_DIFY_API_KEY: ${OPENMAIC_DIFY_API_KEY:-}
      OPENMAIC_DIFY_DATASET_ID: ${OPENMAIC_DIFY_DATASET_ID:-1d2405b1-910a-4820-b06a-ad61b377c1a1}
      OPENMAIC_DIFY_DOCUMENT_NAME_TEMPLATE: ${OPENMAIC_DIFY_DOCUMENT_NAME_TEMPLATE:-[{type}] {title} ({classroom})}
      OPENMAIC_DIFY_TIMEOUT_MS: ${OPENMAIC_DIFY_TIMEOUT_MS:-30000}
      OPENMAIC_DIFY_POLLING_INTERVAL_MS: ${OPENMAIC_DIFY_POLLING_INTERVAL_MS:-2000}
      OPENMAIC_DIFY_MAX_POLLING_ATTEMPTS: ${OPENMAIC_DIFY_MAX_POLLING_ATTEMPTS:-180}
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - openmaic-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  openmaic-data:
